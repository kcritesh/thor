services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: thor
      POSTGRES_DB: thor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thor -d thor"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
